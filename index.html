<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi página web</title>

    <style>
        body {
            background-color: #eaf2ff;
            font-family: Arial, sans-serif;
            margin: 30px;
            color: #222;
        }

        h1 {
            color: #0055aa;
            text-align: center;
        }

        h2 {
            color: #003366;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #0055aa;
            color: white;
        }

        li {
            margin: 8px;
        }
    </style>
</head>

<body>

    <h1>Mi primera página web</h1>

    <h2>Lista no ordenada</h2>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <h2>Lista ordenada</h2>
    <ol>
        <li>Crear el archivo HTML</li>
        <li>Agregar el contenido</li>
        <li>Aplicar estilos CSS</li>
    </ol>

    <h2>Tabla de estudiantes</h2>

    <table>
        <tr>
            <th>Nombre</th>
            <th>Edad</th>
            <th>Curso</th>
            <th>Ciudad</th>
        </tr>
        <tr>
            <td>Juan</td>
            <td>14</td>
            <td>9°</td>
            <td>Cartagena</td>
        </tr>
        <tr>
            <td>María</td>
            <td>15</td>
            <td>10°</td>
            <td>Bogotá</td>
        </tr>
        <tr>
            <td>Carlos</td>
            <td>14</td>
            <td>9°</td>
            <td>Medellín</td>
        </tr>
        <tr>
            <td>Laura</td>
            <td>16</td>
            <td>11°</td>
            <td>Cali</td>
        </tr>
    </table>

</body>
</html>
